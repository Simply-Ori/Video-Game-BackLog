<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Game Backlog</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<h1>My Game Backlog</h1>
		<p>Track the video games you want to play, are currently playing, or have completed.</p>
		<svg class="header-assistant" viewBox="0 0 112 88" aria-hidden="true" focusable="false">
			<path class="assistant-circuit" d="M8 30h14m-8 0v12m-6 0h6m76-12h14m-8 0v12m2 0h6M56 4v10m-5-5h10" />
			<path class="assistant-shell" d="M34 15h44l13 12v31L78 72H34L21 58V27z" />
			<path class="assistant-face" d="M39 29h34a7 7 0 0 1 7 7v15a7 7 0 0 1-7 7H39a7 7 0 0 1-7-7V36a7 7 0 0 1 7-7z" />
			<path class="assistant-signal" d="M42 42h8m12 0h8m-25 8h25" />
			<circle class="assistant-core" cx="56" cy="50" r="2.5" />
			<path class="assistant-detail" d="M42 65h28m-22 12h16M27 24l5-5m53 5-5-5" />
		</svg>

		<form id="game-form">
			<div>
				<label for="game-title">Game title</label>
				<input type="text" id="game-title" name="game-title" required>
			</div>

			<div>
				<label for="platform">Platform</label>
				<input type="text" id="platform" name="platform" required>
			</div>

			<div>
				<label for="status">Status</label>
				<select id="status" name="status" required>
					<option value="want-to-play">Want to Play</option>
					<option value="playing">Playing</option>
					<option value="completed">Completed</option>
				</select>
			</div>

			<div>
				<label for="rating">Rating (1–10)</label>
				<input type="number" id="rating" name="rating" min="1" max="10" required>
			</div>

			<div>
				<label for="notes">Notes</label>
				<textarea id="notes" name="notes" rows="4"></textarea>
			</div>

			<button type="submit">Add Game</button>
		</form>

		<section aria-labelledby="my-games-heading">
			<h2 id="my-games-heading">My Games</h2>
		</section>
	</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="script.js"></script>
</body>
</html>
